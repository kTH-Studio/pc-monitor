<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Monitor — WiFi Setup</title>
<link rel="stylesheet" href="style.css">
<style>
    /* Специально для captive portal — минимум лишнего */
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .setup-box {
        width: 100%;
        max-width: 420px;
    }
    .setup-logo {
        text-align: center;
        margin-bottom: 20px;
        color: var(--fg-bright);
        font-size: 20px;
        letter-spacing: 3px;
    }
    .setup-logo .heart {
        color: var(--red);
        font-size: 24px;
    }
    .wifi-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--fg-dim);
        background: #000;
        margin-bottom: 4px;
        cursor: pointer;
        transition: border-color 0.1s, background 0.1s;
    }
    .wifi-item:hover {
        border-color: var(--fg);
        background: rgba(0, 255, 0, 0.05);
    }
    .wifi-item.selected {
        border-color: var(--fg);
        background: rgba(0, 255, 0, 0.1);
    }
    .wifi-item__name {
        color: var(--fg);
        font-size: 14px;
    }
    .wifi-item__name .lock {
        color: var(--orange);
        margin-right: 6px;
    }
    .wifi-item__rssi {
        font-size: 12px;
        color: var(--fg-dim);
    }
    .wifi-item__rssi.strong  { color: var(--green); }
    .wifi-item__rssi.medium  { color: var(--orange); }
    .wifi-item__rssi.weak    { color: var(--red); }

    .scan-progress {
        text-align: center;
        color: var(--fg-dim);
        font-size: 12px;
        padding: 16px;
    }
    .scan-progress .dot {
        animation: dot-blink 1s infinite;
    }
    .scan-progress .dot:nth-child(2) { animation-delay: 0.2s; }
    .scan-progress .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-blink {
        0%, 60%, 100% { opacity: 0.2; }
        30% { opacity: 1; }
    }

    .setup-actions {
        margin-top: 20px;
    }

    .setup-info {
        margin-top: 24px;
        text-align: center;
        color: var(--fg-dim);
        font-size: 12px;
        line-height: 1.6;
    }

    .status-msg {
        margin-top: 16px;
        padding: 10px;
        text-align: center;
        border: 1px solid var(--fg-dim);
        font-size: 13px;
        display: none;
    }
    .status-msg.show { display: block; }
    .status-msg.ok    { color: var(--green); border-color: var(--green); }
    .status-msg.err   { color: var(--red);   border-color: var(--red); }
</style>
</head>
<body>

<div class="setup-box">

    <!-- Логотип -->
    <div class="setup-logo">
        <span class="heart">♥</span> PC MONITOR
        <div style="font-size:11px; color:var(--fg-dim); margin-top:6px; letter-spacing:1px;">
            WiFi Setup · by KTH-Studio
        </div>
    </div>

    <!-- Основная панель -->
    <div class="panel">

        <h2 class="panel__title">Настройка WiFi</h2>

        <div class="text-dim mb-16" style="font-size:12px; line-height:1.6;">
            ESP32 не подключён к WiFi. Выберите вашу сеть из списка
            или введите данные вручную.
        </div>

        <!-- Список сетей -->
        <div id="wifi-list">
            <div class="scan-progress">
                Сканирую сети<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>

        <div class="mt-8">
            <button class="btn btn--small btn--block" id="btn-rescan">
                🔄 Сканировать заново
            </button>
        </div>

        <!-- Форма -->
        <div class="mt-16" style="border-top: 1px dashed var(--fg-dim); padding-top:16px;">

            <div class="form-row">
                <label>SSID</label>
                <input type="text" id="ssid" placeholder="название сети" autocomplete="off">
            </div>

            <div class="form-row">
                <label>Пароль</label>
                <input type="password" id="pass" placeholder="пароль WiFi" autocomplete="new-password">
            </div>

            <div class="form-row">
                <label>
                    <input type="checkbox" id="show-pass" style="accent-color:var(--fg);">
                    Показать пароль
                </label>
            </div>

        </div>

        <!-- Кнопки -->
        <div class="setup-actions">
            <button class="btn btn--green btn--block" id="btn-connect">
                ПОДКЛЮЧИТЬСЯ
            </button>
        </div>

        <!-- Сообщение о статусе -->
        <div class="status-msg" id="status-msg"></div>

    </div>

    <!-- Инфо -->
    <div class="setup-info">
        После подключения ESP32 перезагрузится.<br>
        Откройте веб-интерфейс по адресу ESP в вашей сети.<br><br>
        <span class="heart" style="color:var(--red);">♥</span> by KTH-Studio
    </div>

</div>

<script>
'use strict';

//  Состояние
let selectedSsid = '';

//  Сканирование WiFi
async function scanWifi() {
    const list = document.getElementById('wifi-list');
    list.innerHTML = `
        <div class="scan-progress">
            Сканирую сети<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
    `;

    try {
        const r = await fetch('/api/wifi/scan', {
            signal: AbortSignal.timeout(15000),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);

        const d = await r.json();
        const nets = (d.networks || []).sort((a, b) => b.rssi - a.rssi);

        renderNetworks(nets);
    } catch (e) {
        console.error('scan error:', e);
        list.innerHTML = `
            <div class="scan-progress" style="color:var(--red);">
                ✗ Ошибка сканирования<br>
                <button class="btn btn--small" onclick="scanWifi()" style="margin-top:8px;">
                    Повторить
                </button>
            </div>
        `;
    }
}

//  Рендер списка сетей
function renderNetworks(nets) {
    const list = document.getElementById('wifi-list');

    if (!nets || nets.length === 0) {
        list.innerHTML = `
            <div class="scan-progress" style="color:var(--orange);">
                Сети не найдены.<br>
                Введите SSID вручную ниже.
            </div>
        `;
        return;
    }

    let html = '';
    for (const n of nets) {
        const lock   = n.enc ? '<span class="lock">🔒</span>' : '';
        const rssiCls = n.rssi > -60 ? 'strong' : (n.rssi > -80 ? 'medium' : 'weak');
        const ssidAttr = escapeAttr(n.ssid);

        html += `
            <div class="wifi-item" data-ssid="${ssidAttr}" onclick="selectNetwork(this)">
                <span class="wifi-item__name">${lock}${escapeHtml(n.ssid)}</span>
                <span class="wifi-item__rssi ${rssiCls}">${n.rssi} dBm</span>
            </div>
        `;
    }
    list.innerHTML = html;
}

//  Выбор сети
function selectNetwork(el) {
    // Убираем подсветку у других
    document.querySelectorAll('.wifi-item').forEach(it => it.classList.remove('selected'));
    el.classList.add('selected');

    const ssid = el.getAttribute('data-ssid');
    document.getElementById('ssid').value = ssid;
    selectedSsid = ssid;

    // Фокус на пароль
    document.getElementById('pass').focus();
}

//  Показать/скрыть пароль
function initShowPass() {
    const cb = document.getElementById('show-pass');
    const pass = document.getElementById('pass');
    cb.addEventListener('change', () => {
        pass.type = cb.checked ? 'text' : 'password';
    });
}

//  Подключение
async function connect() {
    const ssid = document.getElementById('ssid').value.trim();
    const pass = document.getElementById('pass').value;

    if (!ssid) {
        showStatus('Введите SSID', 'err');
        document.getElementById('ssid').focus();
        return;
    }

    if (pass.length < 8 && pass.length > 0) {
        showStatus('Пароль WiFi обычно не короче 8 символов', 'err');
        document.getElementById('pass').focus();
        return;
    }

    // Блокируем кнопку
    const btn = document.getElementById('btn-connect');
    btn.disabled = true;
    btn.textContent = 'ПОДКЛЮЧАЮ...';

    showStatus('Подключаюсь к ' + ssid + '...', 'ok');

    try {
        const r = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                wifi: { ssid, pass }
            }),
            signal: AbortSignal.timeout(10000),
        });

        if (!r.ok) throw new Error('HTTP ' + r.status);

        showStatus('✓ Сохранено. ESP32 перезагружается...', 'ok');

        // ESP перезагрузится — через несколько секунд попробуем открыть
        // стандартный адрес веб-интерфейса
        setTimeout(() => {
            showStatus(
                '✓ Готово! Перенаправляю на веб-интерфейс...',
                'ok'
            );
            // Тут можно попробовать mDNS
            setTimeout(() => {
                window.location.href = 'http://pcmonitor.local/';
            }, 2000);
        }, 5000);

    } catch (e) {
        console.error('connect error:', e);
        showStatus('✗ Ошибка: ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'ПОДКЛЮЧИТЬСЯ';
    }
}

//  Статус-сообщение
function showStatus(text, type) {
    const el = document.getElementById('status-msg');
    el.textContent = text;
    el.className = 'status-msg show ' + (type || '');
}

//  Утилиты
function escapeHtml(s) {
    if (!s) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(s) {
    return escapeHtml(s);
}

//  Инициализация
document.addEventListener('DOMContentLoaded', () => {
    initShowPass();

    // Скан при загрузке
    scanWifi();

    // Кнопки
    document.getElementById('btn-rescan').onclick = scanWifi;
    document.getElementById('btn-connect').onclick = connect;

    // Enter в полях — подключение
    document.getElementById('ssid').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('pass').focus();
    });
    document.getElementById('pass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect();
    });
});

//  Глобальные функции (для inline onclick)
window.selectNetwork = selectNetwork;
window.scanWifi = scanWifi;
</script>

</body>
</html>
